name: Tenia Github Actions

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

jobs:
  # Run tests
  build-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit and integration tests
        run: ./mvnw clean test


  # Build docker image
  build-docker-image:
    needs: build-and-test
    # if this is a merge to main
    # if: github.event_name == 'push' && github.ref == 'refs/head/main'
    runs-on: self-hosted
    outputs:
      app_version: ${{ steps.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract pom version
        id: prep
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"
      - name: Build Docker image
        run: |
          docker build -t leaderboard-app:${{ steps.prep.outputs.version }} .
          docker tag leaderboard-app:${{ steps.prep.outputs.version }} leaderboard-app:latest
  # Deploy to Minikube
  deploy:
    needs: build-docker-image
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5 #Needed for k8s yml files

      - name: Load image into Minikube
        run: |
          minikube image load leaderboard-app:${{ needs.build-docker-image.outputs.app_version }}
          minikube image load leaderboard-app:latest
      - name: Deploy to Minikube # 'needs' is needed to reference output from another job
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/leaderboard-app-deployment leaderboard-app=leaderboard-app:${{ needs.build-docker-image.outputs.app_version }}
          kubectl rollout status deployment/leaderboard-app-deployment
