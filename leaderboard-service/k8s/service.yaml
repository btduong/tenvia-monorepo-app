apiVersion: v1
kind: Service
metadata:
  name: leaderboard-service
spec:
  selector:
    app: leaderboard-app # Need to match deployment label
  ports:
    - protocol: TCP
      port: 8081       # Minikube cluster app port
      targetPort: 8081 # The port in host machine  with Spring Boot app running and listening on
  type: ClusterIP