name: Upload jar to Github Packages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          # Remove this then dont need to use -s settings.xml because maven expect it to be in .m2
#          settings-path: ${{ github.workspace }}

      - name: Run unit and integration tests
        run: ./mvnw clean test

      - name: Publish to Github Packages
        # -B (batch mode) to keep log noise level low
        run: ./mvnw deploy -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

