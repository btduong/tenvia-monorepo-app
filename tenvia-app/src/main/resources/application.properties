server.port=8080

# H2 configs
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# Disable auto create/update table based of entity mapping
spring.jpa.hibernate.ddl-auto=update
# Enable batch fetching
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.sql.init.mode=always

# Ensures _schema.sql runs before data_old.sql
#spring.sql.init.schema-locations=classpath:schema.sql
#spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# JPA logging options
spring.jpa.show-sql=off
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=info

# Actuator - Health monitoring endpoints
management.endpoints.web.exposure.include=health,info,prometheus
# Add tags to all metrics to be used in EKS as adding a label to EKS service will allow Prometheus to see new pods and pulling the data
management.metrics.tags.application=tenvia-app
management.endpoint.health.show-details=always
management.info.env.enabled=true
# Name the service for /info - add more details to include in the json response
info.app.name=Tenvia App
info.app.description=QuizGame

# K8S liveness and readiness probes
management.endpoint.health.probe.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# RabbitMQ config
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Session terminator rate
session.terminator.schedule.rate=60000
session.duration-in-seconds=900

# Question time limit
session.question-time-limit-in-seconds=15

# RabbitConfig
tenvia.rabbit.exchange=game.exchange
tenvia.rabbit.routing-key=score.submitted
tenvia.rabbit.queue=scoring.queue

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cors
cors.allowed-origin=${CORS_ORIGINS:http://localhost:5173}
