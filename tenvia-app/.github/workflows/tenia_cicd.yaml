name: Tenia Github Actions

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

jobs:
  # Run tests
  build-and-test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          cache: 'maven'

      - name: Run unit and integration tests
        run: ./mvnw clean test -U -B
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - name: Build Jar
        run: ./mvnw package -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}


  # Build docker image
  build-docker-image:
    needs: build-and-test
    # if this is a merge to main
    # if: github.event_name == 'push' && github.ref == 'refs/head/main'
    runs-on: self-hosted
    outputs:
      app_version: ${{ steps.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract pom version
        id: prep
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"
      - name: Build Docker image
        run: |
          docker build --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -t tenvia:${{ steps.prep.outputs.version }} .
          docker tag tenvia:${{ steps.prep.outputs.version }} tenvia:latest
  # Deploy to Minikube
  deploy:
    needs: build-docker-image
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5 #Needed for k8s yml files

      - name: Load image into Minikube
        run: |
          minikube image load tenvia:${{ needs.build-docker-image.outputs.app_version }}
          minikube image load tenvia:latest
      - name: Deploy to Minikube # 'needs' is needed to reference output from another job
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/tenvia-app-deployment tenvia-app=tenvia:${{ needs.build-docker-image.outputs.app_version }}
          kubectl rollout status deployment/tenvia-app-deployment
