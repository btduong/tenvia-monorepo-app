name: Tenia Github Actions

on:
  pull_request:
    branches: ['main']
    paths:
      - 'tenvia-app/**'
      - 'tenvia-common/**'
      - 'leaderboard-service/**'
      - 'pom.xml'
  push:
    branches: ['main']
    paths:
      - 'tenvia-app/**'
      - 'tenvia-common/**'
      - 'leaderboard-service/**'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read
  pull-requests: read

jobs:
  # Determine which module changes
  changes:
    runs-on: self-hosted
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tenvia-app:
            - 'tenvia-app/**'
            - 'tenvia-common/**'
            leaderboard-service:
            - 'leaderboard-service/**'
            - 'tenvia-common/**'

  # Run tests
  build-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          cache: 'maven'

      - name: Run unit and integration tests
        # -B (batch) to reduce log noise
        run: ./mvnw clean test -B

  # Build docker image
  docker:
    needs: [build-and-test, changes]
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: self-hosted
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract Maven module version
        id: get_version
        # Point Maven to the specific module's pom.xml
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout -f ${{ matrix.service }}/pom.xml)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Docker Image
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          TAG="${{ matrix.service }}:$VERSION"
          docker build -t $TAG -f ${{ matrix.service }}/Dockerfile .
          echo "Build completed for $TAG"

  # Bump Maven version
  version-bump:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Bump Maven Version
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          if [ -z "$BUMP_TYPE" ]; then
            BUMP_TYPE="patch"
          fi
          
          if [ "$BUMP_TYPE" == "major" ]; then
            NEW_VERSION="\${parsedVersion.nextMajorVersion}.0.0-SNAPSHOT"
          elif [ "$BUMP_TYPE" == "minor" ]; then
            NEW_VERSION="\${parsedVersion.majorVersion}.\${parsedVersion.nextMinorVersion}.0-SNAPSHOT"
          else
            NEW_VERSION="\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion}-SNAPSHOT"
          fi
          
          ./mvnw build-helper:parse-version versions:set \
            -DnewVersion=$NEW_VERSION \
            versions:commit

      - name: Commit and Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status -s) ]]; then
            git add "**/pom.xml" "pom.xml"
            git commit -m "chore: bump version [skip ci]"
            git push
          else
            echo "No version changes detected."
          fi