name: Tenia Github Actions

on:
  pull_request:
    branches: ['main']
    paths:
      - 'tenvia-app/**'
      - 'tenvia-common/**'
      - 'pom.xml'
  push:
    branches: ['main']
    paths:
      - 'tenvia-app/**'
      - 'tenvia-common/**'
      - 'pom.xml'

jobs:
  # Run tests
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          cache: 'maven'

      - name: Run unit and integration tests
        run: ./mvnw clean test -U -B
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - name: Build Jar
        run: ./mvnw package -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

